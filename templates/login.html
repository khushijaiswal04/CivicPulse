{% extends "base.html" %} {% block title %}Login | CivicPulse{% endblock %} {%
block content %}
<section class="form-wrap">
  <div class="form-card">
    <span class="eyebrow">WELCOME BACK</span>
    <h1>Login to CivicPulse</h1>
    <p class="muted">Access your complaints and updates.</p>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <label
        >Email address<input
          type="email"
          name="email"
          required
          autocomplete="email"
      /></label>
      <label
        >Password<input
          type="password"
          name="password"
          required
          autocomplete="current-password"
      /></label>
      <button class="btn primary full" type="submit">Login</button>
    </form>
    <p class="form-foot">
      New here? <a href="{{ url_for('register') }}">Create an account</a>
    </p>
  </div>
</section>
{% endblock %}
